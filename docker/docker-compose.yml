version: '3.8'

services:
  # Operational Database (PostgreSQL OLTP)
  propiq-postgres:
    image: postgres:16-alpine
    container_name: propiq_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: propiq_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # PropIQ Streamlit Web Application & GenAI Platform
  propiq-app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: propiq_app
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@propiq-postgres:5432/propiq_db
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    ports:
      - "8501:8501"
    depends_on:
      propiq-postgres:
        condition: service_healthy
    volumes:
      - ../data:/app/data
      - ../artifacts:/app/artifacts

volumes:
  postgres_data:
